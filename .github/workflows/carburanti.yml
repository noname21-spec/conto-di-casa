name: Aggiorna prezzi carburanti

on:
  schedule:
    - cron: "41 7 * * *"   # ogni mattina, dopo la pubblicazione del MIMIT
  workflow_dispatch:
  push:
    paths:
      - "scripts/aggiorna_carburanti.py"
      - ".github/workflows/carburanti.yml"

permissions:
  contents: write

concurrency:
  group: carburanti
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica e prepara i dati
        run: python3 scripts/aggiorna_carburanti.py
      - name: Salva i dati nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/carburanti
          if git diff --cached --quiet; then
            echo "Nessuna novità"
          else
            git commit -m "Prezzi carburanti del $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
